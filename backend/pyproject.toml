[project]
name = "roda-api"
version = "1.0.0"
description = "Public community metadata and privacy-bounded guidance for RODA"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy[asyncio]>=2.0.38,<3",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1", "google-genai>=1.0,<3", "httpx>=0.28,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]
[tool.ruff]
target-version = "py311"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
